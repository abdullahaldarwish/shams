<!doctype html>
<html lang="ar-SA" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="شمس" />
    <title>نظام إدارة العقود شمس</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>📋 نظام شمس</h1>
      </header>

      <div class="toolbar">
        <div class="tabs">
          <button id="tabAll" class="active" onclick="setView('all')">
            الكل <span class="cnt">(0)</span>
          </button>
          <button id="tabCurrent" onclick="setView('current')">
            الحالية <span class="cnt">(0)</span>
          </button>
          <button id="tabUpcoming" onclick="setView('upcoming')">
            قادمة <span class="cnt">(0)</span>
          </button>
          <button id="tabEnding" onclick="setView('ending')">
            ⏳ قرب الانتهاء <span class="cnt">(0)</span>
          </button>
          <button id="tabEnded" onclick="setView('ended')">
            المنتهية <span class="cnt">(0)</span>
          </button>
        </div>
        <div class="controls">
          <input
            type="text"
            id="searchInput"
            class="search"
            placeholder="بحث بالاسم / الهاتف / رقم العقد..."
            oninput="render()"
          />
        </div>
        <div class="controls">
          <button
            class="btn btn-outline"
            id="datePrefBtn"
            onclick="toggleDatePref()"
          >
            عرض بالهجري
          </button>
          <button class="btn btn-outline" onclick="exportBackup()">
            ⬇ نسخة احتياطية
          </button>
          <button
            class="btn btn-outline"
            onclick="document.getElementById('importFile').click()"
          >
            ⬆ استعادة
          </button>
          <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            style="display: none"
          />
          <button class="btn btn-primary" onclick="openModal()">
            ＋ إضافة عقد
          </button>
        </div>
        <span id="storageStatus" style="font-size: 12px; color: #64748b"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="col-id">#</th>
              <th class="col-name">الاسم الكامل</th>
              <th>رقم الهاتف</th>
              <th>رقم العقد</th>
              <th>الغرفة</th>
              <th>السعر</th>
              <th>البداية</th>
              <th>النهاية</th>
              <th>الحالة</th>
              <th>ملاحظات</th>
              <th>إجراءات</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="overlay" id="modal">
      <div class="modal">
        <h2 id="modalTitle">إضافة عقد جديد</h2>
        <form id="contractForm" onsubmit="return saveContract(event);">
          <div class="form-grid">
            <input type="hidden" id="fId" />
            <div class="field">
              <label>الاسم الكامل <span class="req">*</span></label>
              <input type="text" id="fName" />
            </div>
            <div class="field">
              <label>رقم الهاتف</label>
              <input
                type="tel"
                id="fPhone"
                dir="ltr"
                oninput="normalizeDigits(this)"
              />
            </div>
            <div class="field">
              <label>رقم العقد <span class="req">*</span></label>
              <input
                type="text"
                id="fContractNo"
                oninput="normalizeDigits(this)"
              />
            </div>
            <div class="field">
              <label>رقم الغرفة (1 - 11) <span class="req">*</span></label>
              <input
                type="text"
                id="fRoom"
                inputmode="numeric"
                oninput="normalizeDigits(this)"
              />
            </div>
            <div class="field">
              <label>السعر <span class="req">*</span></label>
              <input
                type="text"
                id="fPrice"
                inputmode="decimal"
                oninput="normalizeDigits(this)"
              />
            </div>
            <div class="field">
              <label>بداية العقد <span class="req">*</span></label>
              <input type="hidden" id="fStart" />
              <input
                type="text"
                id="fStartDisplay"
                class="date-input"
                readonly
                placeholder="يوم/شهر/سنة"
                onclick="openPicker('fStart', 'fStartDisplay')"
              />
              <div class="hijri-hint" id="fStartHijri"></div>
            </div>
            <div class="field full">
              <label>طريقة تحديد نهاية العقد</label>
              <div class="dur-toggle">
                <button
                  type="button"
                  id="modeManual"
                  class="active"
                  onclick="setEndMode('manual')"
                >
                  يدوي
                </button>
                <button
                  type="button"
                  id="modeDays"
                  onclick="setEndMode('days')"
                >
                  بالمدة (أيام)
                </button>
              </div>
            </div>
            <div class="field" id="fEndField">
              <label>نهاية العقد <span class="req">*</span></label>
              <input type="hidden" id="fEnd" />
              <input
                type="text"
                id="fEndDisplay"
                class="date-input"
                readonly
                placeholder="يوم/شهر/سنة"
                onclick="openPicker('fEnd', 'fEndDisplay')"
              />
              <div class="hijri-hint" id="fEndHijri"></div>
            </div>
            <div class="field full" id="durPresets" style="display: none">
              <label>اختر المدة</label>
              <div class="dur-presets">
                <button
                  type="button"
                  class="dur-preset"
                  data-days="7"
                  onclick="setDays(this)"
                >
                  7 أيام
                </button>
                <button
                  type="button"
                  class="dur-preset"
                  data-days="30"
                  onclick="setDays(this)"
                >
                  30 يوم
                </button>
                <button
                  type="button"
                  class="dur-preset"
                  data-days="90"
                  onclick="setDays(this)"
                >
                  90 يوم (3 أشهر)
                </button>
                <button
                  type="button"
                  class="dur-preset"
                  data-days="180"
                  onclick="setDays(this)"
                >
                  180 يوم (6 أشهر)
                </button>
                <button
                  type="button"
                  class="dur-preset"
                  data-days="365"
                  onclick="setDays(this)"
                >
                  365 يوم (سنة)
                </button>
              </div>
              <div class="hijri-hint">تُحسب نهاية العقد تلقائيًا</div>
            </div>
            <div class="field full">
              <label>ملاحظات</label>
              <textarea id="fNotes"></textarea>
            </div>
          </div>
          <div class="error" id="formError"></div>
          <div class="modal-actions">
            <button
              type="button"
              class="btn btn-outline"
              onclick="closeModal()"
            >
              إلغاء
            </button>
            <button type="submit" class="btn btn-primary">حفظ</button>
          </div>
        </form>
      </div>
    </div>

    <div class="overlay cal" id="pickerModal">
      <div class="modal cal-modal">
        <div class="cal-head">
          <button
            type="button"
            class="btn btn-sm btn-outline"
            id="calToggle"
            onclick="calToggle()"
          >
            تحويل إلى هجري
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline"
            onclick="calToday()"
          >
            اليوم
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline"
            onclick="closePicker()"
          >
            ✕
          </button>
        </div>
        <div class="cal-nav">
          <button
            type="button"
            class="nav-btn"
            id="calPrev"
            onclick="calNav(-1)"
          >
            ‹
          </button>
          <div class="cal-title" id="calTitle"></div>
          <button
            type="button"
            class="nav-btn"
            id="calNext"
            onclick="calNav(1)"
          >
            ›
          </button>
        </div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-hint" id="calHint"></div>
      </div>
    </div>

    <div class="confirm-overlay" id="confirmOverlay">
      <div class="confirm-box">
        <h3>تأكيد الحذف</h3>
        <p id="confirmText"></p>
        <div class="row">
          <button class="btn btn-outline" onclick="closeConfirm()">
            إلغاء
          </button>
          <button class="btn btn-danger" id="confirmDeleteBtn">حذف</button>
        </div>
      </div>
    </div>

    <div class="confirm-overlay" id="endOverlay">
      <div class="confirm-box">
        <h3>تأكيد إنهاء العقد</h3>
        <p id="endConfirmText"></p>
        <div class="row">
          <button class="btn btn-outline" onclick="closeEndConfirm()">
            إلغاء
          </button>
          <button class="btn btn-danger" id="confirmEndBtn">إنهاء العقد</button>
        </div>
      </div>
    </div>

    <div class="confirm-overlay" id="cancelEndOverlay">
      <div class="confirm-box">
        <h3>تأكيد إلغاء إنهاء العقد</h3>
        <p id="cancelEndConfirmText"></p>
        <div class="row">
          <button class="btn btn-outline" onclick="closeCancelEndConfirm()">
            إلغاء
          </button>
          <button class="btn btn-danger" id="confirmCancelEndBtn">
            إلغاء الإنهاء
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/constants.js"></script>
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/contracts.js"></script>
    <script src="js/dates.js"></script>
    <script src="js/format.js"></script>
    <script src="js/hijri.js"></script>
    <script src="js/endmode.js"></script>
    <script src="js/picker.js"></script>
    <script src="js/views.js"></script>
    <script src="js/form.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
